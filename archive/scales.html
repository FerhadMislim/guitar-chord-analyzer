<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitar Scale Analyzer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Chords</a>
      <a href="scales.html">Scales</a>
    </nav>
  </header>
  <main>
    <h1>Guitar Scale Analyzer</h1>
    <div>
      <label for="root-note">Root Note:</label>
      <select id="root-note">
        <option value="C">C</option>
        <option value="C#">C#</option>
        <option value="D">D</option>
        <option value="D#">D#</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="F#">F#</option>
        <option value="G">G</option>
        <option value="G#">G#</option>
        <option value="A">A</option>
        <option value="A#">A#</option>
        <option value="B">B</option>
      </select>
      <label for="scale-type">Scale:</label>
      <select id="scale-type">
        <option value="major">Major</option>
        <option value="minor">Minor</option>
        <!-- Add more scales if needed -->
      </select>
      <button id="show-scale">Show Scale</button>
    </div>
    <div id="fretboard"></div>
    <div id="scale-info">
      <h2 id="scale-title"></h2>
      <div id="scale-description"></div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
